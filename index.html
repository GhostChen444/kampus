<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
/* ===== DESIGN (CSS) ===== */
:root{--bg:#F5F7FF;--card:#fff;--ink:#1A2142;--mute:#6B7396;--pri:#4C6FFF;--pri2:#8B7BFF;--ok:#12B886;--line:#E6EAFB;--r:18px}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800;letter-spacing:-.03em}
h2{font-size:1.15rem;font-weight:700;margin:28px 0 12px}h3{font-weight:700;margin-bottom:12px}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-weight:800;font-size:1.3rem;padding:0 10px 18px;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;color:transparent}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:none;border-radius:12px;cursor:pointer;text-align:left;color:var(--mute);font-weight:500}
.nav:hover{background:var(--bg)}.nav.on{background:#EEF1FF;color:var(--pri);font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.side-t{margin:18px 12px 6px;font-size:.8rem;color:var(--mute)}
main{padding:32px clamp(16px,4vw,48px) 100px;max-width:1100px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 8px 30px -18px rgba(76,111,255,.35)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{cursor:pointer;border:0;text-align:left;border-radius:var(--r);padding:18px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}.tile b{font-size:1.05rem}.tile small{opacity:.75}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:20px}
.stat b{font-size:1.9rem;font-weight:800;display:block}.stat span{color:var(--mute)}
.btn{border:0;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;cursor:pointer}
.btn.ghost{background:#EEF1FF;color:var(--pri)}.btn.sm{padding:6px 12px;font-size:.85rem}.btn.del{background:#FFECEC;color:#E03131}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}.sp{justify-content:space-between}
.tabs{display:flex;gap:6px;background:#EEF1FF;padding:5px;border-radius:14px;width:max-content;margin:18px 0}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--mute)}
.tabs .on{background:#fff;color:var(--pri);box-shadow:0 2px 8px rgba(76,111,255,.15)}
.bar{height:10px;background:#E8ECFF;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--ok));border-radius:9px;transition:width .5s}
.note{margin-bottom:12px}.note p{white-space:pre-wrap;color:#3B4468;margin-top:6px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;cursor:pointer}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.item.sub{margin-left:34px}.item .g{flex:1}.item small{color:var(--mute)}.done .t{text-decoration:line-through;opacity:.5}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok)}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:12px}
input:not([type=checkbox]),select,textarea{display:block;width:100%;margin-top:5px;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);border-color:transparent}
.empty{text-align:center;color:var(--mute);padding:30px}
#modal{position:fixed;inset:0;background:rgba(26,33,66,.35);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:9}
#modal[hidden]{display:none}.sheet{background:#fff;border-radius:22px;padding:24px;width:min(560px,100%);max-height:90vh;overflow:auto}
.sheet video,.sheet .big{width:100%;border-radius:14px;background:#000}
.drop{border:2px dashed #BFC9FF;border-radius:24px;padding:48px 20px;text-align:center;background:#fff;cursor:pointer}
.drop:hover{background:#F0F3FF}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:flex;align-items:center;gap:6px;background:#EEF1FF;color:var(--pri);padding:6px 6px 6px 12px;border-radius:99px;font-weight:600}

.center{min-height:100vh;display:grid;place-items:center;padding:20px}.center .card{width:min(440px,100%);padding:32px}
.err{color:#E03131;margin-top:10px;min-height:1.4em}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
#toast.on{opacity:1}
.bottom{display:none}
body{min-height:100dvh}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs{max-width:100%;overflow-x:auto;scrollbar-width:none}.tabs button{white-space:nowrap}
.two{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.chip small{opacity:.7;font-weight:500}
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:16px}
.cap{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.cap img{width:100%;aspect-ratio:4/3;object-fit:cover;cursor:pointer;display:block}
.cb{padding:12px 14px}.cb p{color:#3B4468;white-space:pre-wrap;word-break:break-word}.cb p.none{color:var(--mute);font-style:italic}.cb .row{margin-top:10px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;background:#EEF1FF;color:var(--pri)}.badge.ok{background:#E6F8F1;color:#0B7A57}.badge.warn{background:#FFF3E0;color:#B35C00}
.desc{color:#3B4468;white-space:pre-wrap;margin-top:4px;word-break:break-word}.sec{font-size:.95rem;font-weight:700;margin:18px 0 8px}.item .g small{display:block}
.notice{background:#FFF3E0;color:#B35C00;padding:10px 12px;border-radius:12px;margin-bottom:14px;font-size:.88rem}
.ck{display:flex;gap:10px;align-items:flex-start;font-weight:500;margin-bottom:10px}.ck input{flex:none;margin-top:2px}.ck img{width:56px;height:42px;object-fit:cover;border-radius:8px;flex:none}
.pre{width:100%;max-height:240px;object-fit:contain;border-radius:14px;background:#F0F3FF;margin-bottom:14px}
@media(max-width:1000px){.shell{grid-template-columns:210px 1fr}}
@media(max-width:800px){.shell{display:block}aside{display:none}
main{padding:20px 16px calc(92px + env(safe-area-inset-bottom))}
.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
.bottom .nav{flex:1;flex-direction:column;gap:3px;font-size:.74rem;justify-content:center;align-items:center;padding:8px 4px}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.tile{min-height:96px;padding:14px}
.stats{grid-template-columns:repeat(2,1fr)}.caps{grid-template-columns:1fr 1fr}
.btn{min-height:42px}input:not([type=checkbox]),select,textarea{font-size:16px}
#modal{align-items:end;padding:0}.sheet{width:100%;border-radius:22px 22px 0 0;max-height:92dvh;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
#toast{bottom:calc(88px + env(safe-area-inset-bottom));max-width:90vw;text-align:center}
.item.sub{margin-left:16px}.center .card{padding:24px 20px}}
@media(max-width:480px){.caps{grid-template-columns:1fr}.two{grid-template-columns:1fr 1fr}.two label:first-child{grid-column:1/-1}.item{flex-wrap:wrap}.item .g{min-width:60%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
</style></head>

<script type="module">
/* ===== 1. CONFIGURATION FIREBASE (à modifier) ===== */
// Console Firebase > Paramètres du projet > Vos applications > Configuration SDK
const cfg = {
  apiKey: "AIzaSyCd3ghkf-PK1p7CFFa1ASPxUXmtt8vtCJQ",
  authDomain: "kampus-5c415.firebaseapp.com",
  projectId: "kampus-5c415",
  storageBucket: "kampus-5c415.firebasestorage.app",
  messagingSenderId: "722075555508",
  appId: "1:722075555508:web:1419f6fe1d555c892ca9e1"
};
// Compte de démonstration admin / admin (données fictives, locales, jamais envoyées à Firebase).
// Mettez false avant la mise en production.
const DEMO_ON = false;

/* ===== 2. MODE DÉMO (admin / admin) ===== */
const D=(()=>{
// Mode démo : même API que Firestore, mais en mémoire. Aucune donnée n'est envoyée nulle part.
const store={},subs=new Set();
const notify=()=>subs.forEach(h=>h());
const idOf=p=>p.split('/').pop();
const collection=(_,...p)=>({kind:'col',path:p.join('/'),f:[]});
const doc=(_,...p)=>({kind:'doc',path:p.join('/')});
const where=(f,o,v)=>({f,v});
const query=(c,...w)=>({...c,f:w});
const list=c=>Object.keys(store).filter(k=>k.startsWith(c.path+'/')&&!k.slice(c.path.length+1).includes('/')&&c.f.every(w=>store[k][w.f]===w.v)).map(k=>({id:idOf(k),data:()=>({...store[k]})}));
const onSnapshot=(r,cb)=>{const run=()=>r.kind==='doc'?cb({exists:()=>r.path in store,data:()=>store[r.path]&&{...store[r.path]}}):cb({docs:list(r)});const h=()=>setTimeout(run,0);subs.add(h);h();return()=>subs.delete(h)};
const put=(r,d,o)=>{store[r.path]=o?.merge?{...store[r.path],...d}:{...d}};
const addDoc=async(c,d)=>{const id='d'+Math.random().toString(36).slice(2,9);store[c.path+'/'+id]={...d};notify();return{id}};
const setDoc=async(r,d,o)=>{put(r,d,o);notify()};
const updateDoc=async(r,d)=>{put(r,d,{merge:1});notify()};
const deleteDoc=async r=>{delete store[r.path];notify()};
const getDocs=async q=>({docs:list(q)});
const writeBatch=()=>{const ops=[];return{set:(r,d,o)=>ops.push(()=>put(r,d,o)),delete:r=>ops.push(()=>delete store[r.path]),commit:async()=>{ops.forEach(f=>f());notify()}}};
const reset=()=>{Object.keys(store).forEach(k=>delete store[k]);notify()};

const SAMPLE=['Algorithmique','Base de données','Réseaux informatiques','Génie logiciel','Intelligence artificielle','Anglais technique'];
const pic=(h,t)=>'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="hsl(${h} 90% 96%)"/><rect x="24" y="24" width="252" height="252" rx="14" fill="#fff"/><text x="44" y="64" font-family="sans-serif" font-size="18" font-weight="700" fill="hsl(${h} 55% 35%)">${t}</text>${[100,128,156,184,212,240].map((y,i)=>`<rect x="44" y="${y}" width="${200-i*14}" height="7" rx="3.5" fill="hsl(${h} 60% 85%)"/>`).join('')}</svg>`);
function seedExtras(P=''){
  const U='users/demo/',day=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10),now=Date.now();
  const add=(p,d)=>store[U+p]=d;
  [['algorithmique','Complexité algorithmique','Notation O(n), O(n log n), O(n²).\n• Meilleur, moyen et pire cas\n• Un tri fusion reste en O(n log n) dans tous les cas'],
   ['algorithmique','Tri rapide','Choix du pivot, partition, récursivité.\nPire cas O(n²) si le pivot est toujours le minimum.'],
   ['base-de-donnees','Normalisation','1FN : valeurs atomiques.\n2FN : pas de dépendance partielle.\n3FN : pas de dépendance transitive.'],
   ['reseaux-informatiques','Modèle OSI','7 couches : physique, liaison, réseau, transport, session, présentation, application.']
  ].forEach(([cid,title,body],i)=>add('notes/n'+i,{cid:P+cid,title,body,ts:now-i*1e5}));
  add('media/m0',{scope:'c:'+P+'algorithmique',ref:'',data:pic(225,'Tableau : tri rapide'),desc:'Tableau du cours : déroulement du tri rapide pas à pas.',ts:now});
  add('media/m1',{scope:'c:'+P+'algorithmique',ref:'',data:pic(265,'Schéma : arbre binaire'),desc:'Schéma d\'un arbre binaire de recherche, avec les cas de parcours.',ts:now-1});
  add('media/m2',{scope:'c:'+P+'algorithmique',ref:'',data:pic(160,'Exemple de partition'),desc:'Exemple de partition autour du pivot, relevé en cours.',ts:now-2});
  [['algorithmique','Série d\'exercices n°3',2],['base-de-donnees','TP : requêtes SQL avancées',4],['reseaux-informatiques','Exposé sur le routage',7],['anglais-technique','Rédiger un résumé d\'article',1]]
   .forEach(([cid,title,d],i)=>add('tasks/t'+i,{cid:P+cid,title,due:day(d),done:i===3,ts:now-i}));
  add('pfe/main',{title:'Plateforme de suivi énergétique par IoT',theme:'Internet des objets et analyse de données',desc:'Conception d\'une application web qui collecte les mesures de capteurs et affiche la consommation en temps réel.'});
  [['p1','Étude de l\'existant',null,0],['p1a','Analyse de 5 solutions concurrentes','p1',1],['p1b','Recueil des besoins','p1',1],
   ['p2','Conception',null,0],['p2a','Schéma de la base de données','p2',1],['p2b','Maquettes des écrans','p2',0],
   ['p3','Développement',null,0],['p3a','API de collecte des mesures','p3',1],['p3b','Tableau de bord','p3',0],['p3c','Alertes de surconsommation','p3',0],
   ['p4','Rédaction du rapport',null,0]]
   .forEach(([id,title,parent,done],i)=>add('ptasks/'+id,{title,desc:parent?'':'Étape clé du projet.',parent,done:!!done,report:done?'Travail réalisé et vérifié ; résultats conformes aux attentes.':'',ts:now+i}));
  add('media/s0',{scope:'pfe',ref:'p3a',data:pic(200,'Capture : test API'),desc:'Test de l\'API de collecte : requête envoyée et réponse obtenue.',ts:now});
  add('media/s1',{scope:'pfe',ref:'p2a',data:pic(150,'Capture : schéma BDD'),desc:'Schéma de la base de données validé avec l\'encadrant.',ts:now-1});
  notify();
}

return {collection,doc,where,query,onSnapshot,addDoc,setDoc,updateDoc,deleteDoc,getDocs,writeBatch,reset,SAMPLE,seedExtras}})();
/* ===== 3. APPLICATION ===== */
let F=null,auth,db;
const LIVE=!/^VOTRE_/.test(cfg.apiKey);
try{if(!LIVE)throw 'demo';const u=m=>`https://www.gstatic.com/firebasejs/10.14.1/firebase-${m}.js`;
  const [a,b,c]=await Promise.all([import(u('app')),import(u('auth')),import(u('firestore'))]);
  F={...b,...c};const app=a.initializeApp(cfg);auth=F.getAuth(app);await F.setPersistence(auth,F.inMemoryPersistence);db=F.getFirestore(app)}
catch(e){if(LIVE)console.warn('Firebase indisponible',e)}
let X=F||D;
const [collection,doc,addDoc,setDoc,updateDoc,deleteDoc,onSnapshot,query,where,writeBatch,getDocs]=['collection','doc','addDoc','setDoc','updateDoc','deleteDoc','onSnapshot','query','where','writeBatch','getDocs'].map(n=>(...a)=>X[n](...a));
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const hue=s=>[...norm(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))&0xffff,7)%360;
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'c'+hue(s);
const S={sid:null,imp:false,target:null,mig:0,semesters:[],pdfs:[],ld:{},user:null,ready:false,profile:{},courses:[],tasks:[],ptasks:[],pfe:null,notes:[],media:[],view:'home',cid:null,tab:'notes',found:null,slots:{},manual:false,notice:'',demo:false,busy:'',w:{},subs:[]};
const col=p=>collection(db,'users',S.user.uid,p), dref=(p,id)=>doc(db,'users',S.user.uid,p,id);
let pend=null,stream=null,back=null,last=Date.now(),tk=null,purl=null;
const cs=()=>S.courses.filter(c=>c.sid===S.sid),TS=()=>S.tasks.filter(t=>cs().some(c=>c.id===t.cid)),semOf=id=>S.semesters.find(s=>s.id===id),CH=7e5;
/* Migration : anciennes rubriques sans semestre -> « Semestre 1 » */
function mig(){if(S.mig||!S.ld.courses||!S.ld.semesters||S.semesters.length||!S.courses.some(c=>!c.sid))return;S.mig=1;const b=writeBatch(db);b.set(dref('semesters','semestre-1'),{name:'Semestre 1',desc:'Rubriques déjà existantes',ts:Date.now()});S.courses.filter(c=>!c.sid).forEach(c=>b.set(dref('courses',c.id),{sid:'semestre-1'},{merge:true}));b.commit()}
/* ---------- Sécurité : blocage après 8 échecs (5 min) et inactivité (5 min) ---------- */
const LK='kampus_lock',MAXTRY=8,LOCKMS=300000,IDLE=300000;
const lk=()=>{try{return JSON.parse(localStorage.getItem(LK))||{n:0,until:0}}catch{return{n:0,until:0}}};
const setLk=o=>{try{localStorage.setItem(LK,JSON.stringify(o))}catch{}};
const left=()=>Math.max(0,lk().until-Date.now());
function fail(){const o=lk();if(o.until&&o.until<=Date.now()){o.n=0;o.until=0}o.n++;if(o.n>=MAXTRY){o.until=Date.now()+LOCKMS;o.n=0}setLk(o);return o}
function tick(){clearInterval(tk);const f=()=>{const e=$('#err'),b=$('#login .btn');if(!e||!b){clearInterval(tk);return}const r=left();
  if(r<=0){clearInterval(tk);b.disabled=false;e.textContent='';return}b.disabled=true;const s=Math.ceil(r/1000);e.textContent=`Trop de tentatives échouées. Réessayez dans ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}.`};f();tk=setInterval(f,1000)}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2400)}
function openModal(h){$('#modal').innerHTML=`<div class="sheet">${h}</div>`;$('#modal').hidden=false}
function closeModal(){if(purl){URL.revokeObjectURL(purl);purl=null}stream?.getTracks().forEach(t=>t.stop());stream=null;$('#modal').hidden=true;const p=pend;pend=null;p?.(null)}
const sub=u=>S.subs.push(u);
function watch(k,q){S.w[k]?.();S[k]=[];S.w[k]=q?onSnapshot(q,s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));render()}):null}

/* ---------- Auth & données ---------- */
function start(u){
  S.subs.forEach(f=>f());S.subs=[];Object.keys(S.w).forEach(k=>watch(k,null));
  S.user=u;if(u){S.notice='';last=Date.now()}S.ready=false;S.profile={};S.view='home';S.cid=null;S.found=null;S.slots={};S.manual=false;S.sid=null;S.imp=false;S.target=null;S.mig=0;S.ld={};
  if(u){const uid=u.uid,c=p=>collection(db,'users',uid,p),list=(p,k)=>sub(onSnapshot(c(p),s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));S.ld[k]=1;mig();render()}));
    sub(onSnapshot(doc(db,'users',uid),d=>{S.profile=d.data()||{};S.ready=true;render()},err=>{console.error(err);toast('Accès refusé : vérifiez les règles Firestore')}));
    list('courses','courses');list('tasks','tasks');list('ptasks','ptasks');list('semesters','semesters');list('pdfs','pdfs');
    sub(onSnapshot(doc(db,'users',uid,'pfe','main'),d=>{S.pfe=d.exists()?d.data():null;render()}));
  }
  render();
}
F?F.onAuthStateChanged(auth,u=>{if(!S.demo)start(u)}):start(null);

/* ---------- Utilitaires : formulaires, caméra, images ---------- */

const tidy=s=>s.replace(/\s+/g,' ').replace(/([a-zà-ÿ])\.\s+(?=[A-ZÀ-Ý])/g,'$1, ').replace(/\s*-\s*\([^)]*\)\s*$/,'').replace(/^[\s\-–•|]+|[\s\-–|]+$/g,'');
const valid=s=>s.length>=4&&s.length<=90&&!NOISE.test(s)&&/[a-zà-ÿ]{3}/i.test(s);
const capsRatio=s=>{const l=s.replace(/[^A-Za-zÀ-ÿ]/g,'');return l.length?[...l].filter(c=>c===c.toUpperCase()).length/l.length:0};

/* Une case = intitulé (minuscules) + enseignant (MAJUSCULES) + salle. On ne garde que l'intitulé. */
function extract(chunks){const out=new Map();let buf=[],skip=false;
  const flush=()=>{const s=tidy(buf.join(' '));buf=[];
    if(valid(s)){const k=norm(s);if(![...out.keys()].some(x=>sim(x,k)>=.82))out.set(k,s)}};
  for(const ch of chunks){
    for(const raw of String(ch).split('\n')){
      const l=raw.replace(/[|_]+/g,' ').replace(/\s+/g,' ').trim();
      if(!l){flush();skip=false}
      else if(isCaps(l)||isRoom(l)){flush();skip=false}
      else if(HEAD.test(l)){flush();skip=true}
      else if(!skip)buf.push(l)}

   5 binarisation d'Otsu de chaque case  6 OCR (réseau LSTM) en gardant les lignes AVANT le premier nom d'enseignant
   7 vote : les variantes d'une même matière sont regroupées, la lecture la plus fiable gagne */

  let cv=document.createElement('canvas');cv.width=W;cv.height=H;let g=cv.getContext('2d',{willReadFrequently:true});g.fillStyle='#fff';g.fillRect(0,0,W,H);g.drawImage(bmp,0,0,W,H);

<div class="row"><button class="btn sm" data-a="newCourse">Ajouter une rubrique</button><button class="btn ghost sm" data-a="newSched">Mettre à jour l'emploi du temps</button></div>`}
function coursePage(){const c=course(S.cid);if(!c)return '<div class="empty">Rubrique introuvable</div>';
  const t=S.tasks.filter(x=>x.cid===c.id);
  return `<button class="btn ghost sm" data-a="go" data-v="home">Retour</button><div class="row sp" style="margin-top:6px"><h1>${esc(c.name)}</h1><span class="row" style="margin:0"><button class="btn sm" data-a="fiche">Fiche de révision (PDF)</button><button class="btn del sm" data-a="delc" data-id="${c.id}">Supprimer la rubrique</button></span></div>${c.slots?.length?`<p style="color:var(--mute)">${esc(slotTxt(c.slots))}</p>`:''}
<div class="tabs">${[['notes','Notes'],['photos','Captures'],['tasks','Travaux'],['later','À lire plus tard']].map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-t="${k}">${l}</button>`).join('')}</div>
${S.tab==='notes'?`<button class="btn" data-a="note">+ Nouvelle note</button><div style="margin-top:16px">${S.notes.map(n=>`<div class="card note"><div class="row sp" style="margin:0"><b>${esc(n.title)}</b><span class="row" style="margin:0"><button class="btn ghost sm" data-a="note" data-id="${n.id}">Modifier</button><button class="btn del sm" data-a="del" data-p="notes" data-id="${n.id}">Suppr.</button></span></div><p>${esc(n.body)}</p></div>`).join('')||'<div class="empty">Aucune note. Ajoutez les notions essentielles du cours.</div>'}</div>`
:S.tab==='photos'?`<button class="btn" data-a="photo" data-s="c:${c.id}">Ajouter une capture</button><div class="caps">${S.media.map(capCard).join('')}</div>${S.media.length?'':'<div class="empty">Aucune capture. Photographiez votre tableau ou votre cahier, puis décrivez-la.</div>'}`
:S.tab==='later'?pdfBlock(c.id):`<button class="btn" data-a="task" data-c="${c.id}">+ Travail à faire</button><div class="card" style="margin-top:16px">${t.map(taskRow).join('')||'<div class="empty">Rien à rendre.</div>'}</div>`}`}
const sz=n=>n>1e6?(n/1e6).toFixed(1)+' Mo':Math.max(1,Math.round(n/1e3))+' Ko';
const pdfRow=p=>`<div class="item"><div class="g"><div class="t" style="font-weight:600">${esc(p.title)}</div><small>${esc(course(p.cid)?.name||'Sans rubrique')} · ${sz(p.size)} · ${new Date(p.ts).toLocaleDateString('fr-FR')}</small></div><span class="row" style="margin:0"><button class="btn ghost sm" data-a="pread" data-id="${p.id}">Lire</button><button class="btn ghost sm" data-a="pdl" data-id="${p.id}">Télécharger</button><button class="btn del sm" data-a="pdelf" data-id="${p.id}">Supprimer</button></span></div>`;
const pdfList=l=>`<div class="card" style="margin-top:16px">${[...l].sort((a,b)=>b.ts-a.ts).map(pdfRow).join('')||'<div class="empty">Aucun document. Ajoutez un PDF précieux à lire plus tard.</div>'}</div>`;
const pdfBlock=cid=>`<button class="btn" data-a="padd" data-c="${cid}">+ Ajouter un PDF</button>${pdfList(S.pdfs.filter(p=>p.cid===cid))}`;
const docsPage=()=>`<h1>Documents</h1><p style="color:var(--mute)">Vos cours à lire plus tard, conservés d'une session à l'autre.</p><div class="row"><button class="btn" data-a="padd">+ Ajouter un PDF</button></div>${pdfList(S.pdfs)}`;
async function pdfBlob(p){const {docs}=await getDocs(query(col('pdfchunks'),where('did','==',p.id)));const b=docs.map(d=>d.data()).sort((a,b)=>a.i-b.i);if(b.length!==p.n)throw 0;const bin=atob(b.map(x=>x.data).join('')),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:'application/pdf'})}
const picker=()=>`<div class="center"><div style="width:min(640px,100%)"><h1>Choisissez votre semestre</h1><p style="color:var(--mute);margin:8px 0 22px">Touchez un semestre pour retrouver vos rubriques, ou ajoutez-en un nouveau.</p><div class="grid" style="grid-template-columns:1fr">${[...S.semesters].sort(asc).map(x=>`<div class="card" style="cursor:pointer" data-a="pickS" data-id="${x.id}"><div class="row sp" style="margin:0"><b>${esc(x.name)}</b><button class="btn ghost sm" data-a="editS" data-id="${x.id}">Modifier</button></div>${x.desc?`<p class="desc">${esc(x.desc)}</p>`:''}<small style="color:var(--mute)">${S.courses.filter(c=>c.sid===x.id).length} rubrique(s)</small></div>`).join('')}</div><div class="row"><button class="btn" data-a="addS">+ Ajouter un semestre</button><button class="btn ghost" data-a="out">Se déconnecter</button></div></div></div>`;
const capCard=m=>`<figure class="cap"><img src="${m.data}" data-a="view" data-id="${m.id}" alt="${esc(m.desc||'Capture')}"><div class="cb"><p class="${m.desc?'':'none'}">${esc(m.desc||'Aucune description')}</p><div class="row"><button class="btn ghost sm" data-a="editcap" data-id="${m.id}">Modifier</button><button class="btn del sm" data-a="delm" data-id="${m.id}">Supprimer</button></div></div></figure>`;
const taskRow=t=>`<div class="item ${t.done?'done':''}"><input type="checkbox" data-a="tdone" data-id="${t.id}" ${t.done?'checked':''}><div class="g"><div class="t">${esc(t.title)}</div><small>${esc(course(t.cid)?.name||'')}${t.due?' · pour le '+new Date(t.due).toLocaleDateString('fr-FR'):''}</small></div><button class="btn del sm" data-a="del" data-p="tasks" data-id="${t.id}">×</button></div>`;
function tasksPage(){const l=[...TS()].sort((a,b)=>(a.done-b.done)||(a.due||'9').localeCompare(b.due||'9'));
  return `<h1>Travaux à faire</h1><div class="row"><button class="btn" data-a="task">+ Ajouter un travail</button></div><div class="card" style="margin-top:16px">${l.map(taskRow).join('')||'<div class="empty">Aucun travail. Profitez-en !</div>'}</div>`}
const annRow=t=>{const ok=isDone(t),n=S.media.filter(x=>x.ref===t.id).length,r=!!(t.report||'').trim();
  return `<div class="item sub ${ok?'done':''}"><input type="checkbox" data-a="pdone" data-id="${t.id}" ${ok?'checked':''} aria-label="Marquer comme exécutée"><div class="g"><div class="t">${esc(t.title)}</div>${t.desc?`<small>${esc(t.desc)}</small>`:''}<div class="badges"><span class="badge">${n} capture${n>1?'s':''}</span><span class="badge ${r?'ok':'warn'}">${r?'Compte rendu rédigé':'Compte rendu manquant'}</span></div></div><span class="row" style="margin:0"><button class="btn ghost sm" data-a="pdetail" data-id="${t.id}">Ouvrir</button><button class="btn ghost sm" data-a="ptask" data-id="${t.id}">Modifier</button><button class="btn del sm" data-a="pdel" data-id="${t.id}">Supprimer</button></span></div>`};
function pfePage(){const p=S.pfe;
  if(!p)return `<h1>Mon PFE</h1><div class="card" style="margin-top:16px"><p>Aucun PFE enregistré. Renseignez le titre, le thème et la description de votre projet de fin d'études.</p><div class="row"><button class="btn" data-a="pfeEdit">Ajouter mon PFE</button></div></div>`;
  const mains=S.ptasks.filter(t=>!t.parent).sort((a,b)=>a.ts-b.ts),ann=S.ptasks.filter(t=>t.parent),ad=ann.filter(isDone).length,md=mains.filter(isDone).length;
  return `<div class="row sp" style="margin-top:0"><h1>${esc(p.title)}</h1><span class="row" style="margin:0"><button class="btn ghost sm" data-a="pfeEdit">Modifier</button><button class="btn del sm" data-a="pfeDel">Supprimer</button></span></div>
<p style="color:var(--mute)">Thème : ${esc(p.theme||'Non précisé')}</p>${p.desc?`<p class="desc">${esc(p.desc)}</p>`:''}
<div class="card" style="margin:18px 0"><div class="row sp" style="margin:0 0 8px"><b>Avancement</b><b>${pct()}%</b></div><div class="bar"><i style="width:${pct()}%"></i></div>
<p style="color:var(--mute);margin-top:10px">${md} sur ${mains.length} tâche(s) principale(s) terminée(s) · ${ad} sur ${ann.length} tâche(s) annexe(s) exécutée(s)</p></div>
<div class="row sp"><h2 style="margin:0">Tâches</h2><button class="btn sm" data-a="ptask">+ Tâche principale</button></div>
<div class="card" style="margin-top:12px">${mains.map(m=>{const k=kids(m.id),n=k.length,a=k.filter(isDone).length,ok=isDone(m);
 return `<div class="item" style="align-items:flex-start"><div class="g"><div class="t" style="font-weight:700">${esc(m.title)}</div>${m.desc?`<small>${esc(m.desc)}</small>`:''}<div class="badges"><span class="badge ${ok?'ok':n?'':'warn'}">${ok?'Terminée':n?a+' sur '+n+' annexes exécutées':'Aucune tâche annexe'}</span></div>${n?`<div class="bar" style="margin-top:8px"><i style="width:${Math.round(a/n*100)}%"></i></div>`:''}</div><span class="row" style="margin:0"><button class="btn ghost sm" data-a="ptask" data-id="${m.id}">Modifier</button><button class="btn del sm" data-a="pdel" data-id="${m.id}">Supprimer</button></span></div>`
 +k.map(annRow).join('')+`<div class="item sub"><button class="btn ghost sm" data-a="ptask" data-p="${m.id}">+ Tâche annexe</button></div>`}).join('')||'<div class="empty">Ajoutez votre première tâche principale, puis décomposez-la en tâches annexes.</div>'}</div>`}

function render(){const a=$('#app');
  if(!S.user){a.innerHTML=login();if(left()>0)tick();return}
  if(!S.ready){a.innerHTML='<div class="center"><b>Chargement…</b></div>';return}
  if(S.found||S.busy||S.imp||(S.ld.courses&&S.ld.semesters&&!S.semesters.length&&!S.courses.length)){a.innerHTML=upload();return}
  if(!S.sid||!semOf(S.sid)){a.innerHTML=S.semesters.length?picker():'<div class="center"><b>Chargement…</b></div>';return}
  const body=S.view==='course'?coursePage():S.view==='tasks'?tasksPage():S.view==='pfe'?pfePage():S.view==='docs'?docsPage():home();
  a.innerHTML=`<div class="shell"><aside><div class="logo">Kampus</div>${nav('home',IC.home,'Accueil')}${nav('tasks',IC.tasks,'Travaux')}${nav('pfe',IC.pfe,'Mon PFE')}${nav('docs',IC.docs,'Documents')}
<div class="side-t">Rubriques</div>${cs().map(c=>`<button class="nav ${S.cid===c.id&&S.view==='course'?'on':''}" data-a="open" data-id="${c.id}"><span class="dot" style="background:hsl(${c.hue} 70% 55%)"></span>${esc(c.name)}</button>`).join('')}
<div class="side-t"><button class="nav" data-a="out">${IC.out} Se déconnecter</button></div></aside><main>${body}</main>
<nav class="bottom">${nav('home',IC.home,'Accueil')}${nav('tasks',IC.tasks,'Travaux')}${nav('pfe',IC.pfe,'PFE')}${nav('docs',IC.docs,'Docs')}<button class="nav" data-a="out">${IC.out} Quitter</button></nav></div>`}

 go:e=>go(e.v),out:()=>{if(S.demo){S.demo=false;D.reset();X=F||D;start(null)}else F.signOut(auth)},sample:()=>{S.found=[...D.SAMPLE];S.manual=false;S.slots={};S.scheduleName='exemple.png';render()},close:closeModal,
 open:e=>{S.view='course';S.cid=e.id;S.tab='notes';watch('notes',query(col('notes'),where('cid','==',e.id)));watch('media',query(col('media'),where('scope','==','c:'+e.id)));render()},

 photo:e=>addPhoto(e.s,''),
 view:e=>{const m=S.media.find(x=>x.id===e.id);openModal(`<img class="big" src="${m.data}" alt=""><p style="margin-top:12px;white-space:pre-wrap">${esc(m.desc||'Aucune description')}</p><div class="row"><button class="btn ghost" data-a="editcap" data-id="${m.id}">Modifier la description</button><button class="btn del" data-a="delm" data-id="${m.id}">Supprimer</button><button class="btn ghost" data-a="pback">Fermer</button></div>`)},
 delm:async e=>{if(!confirm('Supprimer cette capture ?'))return;S.media=S.media.filter(x=>x.id!==e.id);await deleteDoc(dref('media',e.id));closeModal();if(back)A.pdetail({id:back})},

 fiche:()=>{const c=course(S.cid);if(!c)return;const ns=[...S.notes].sort(asc),ms=[...S.media].sort(asc);

${ms.length?`<div class="sec">Captures à inclure</div>${ms.map(m=>`<label class="ck"><input type="checkbox" name="m" value="${m.id}" checked><img src="${m.data}" alt=""><span>${esc(m.desc||'Sans description')}</span></label>`).join('')}`:''}
<div class="row"><button class="btn" id="fibtn">Télécharger le PDF</button><button type="button" class="btn ghost" data-a="close">Annuler</button></div></form>`)},
 manualS:()=>{S.found=[];S.slots={};S.manual=true;render()},
 newCourse:async()=>{const v=await ask('Nouvelle rubrique',[{k:'n',l:'Nom de la matière *',v:'',req:1},{k:'d',l:'Jour (facultatif)',t:'select',v:'',o:[['','Non précisé'],...DAYS.map(d=>[d,d])]},{k:'s',l:'Début (facultatif)',t:'time',v:''},{k:'e',l:'Fin (facultatif)',t:'time',v:''}],'Créer');
  if(!v)return;const n=v.n.trim().replace(/\s+/g,' '),id=S.sid+'-'+slug(n),slots=[...(course(id)?.slots||[])];if(v.d||v.s||v.e)slots.push({d:v.d||'',s:v.s||'',e:v.e||''});

 rm:e=>{const x=S.found.splice(+e.i,1)[0];delete S.slots[norm(x)];render()},
 addf:async()=>{const v=await ask('Ajouter une matière',[{k:'n',l:'Nom',v:'',req:1}],'Ajouter');if(v&&!S.found.some(x=>norm(x)===norm(v.n)))S.found.push(v.n.trim());render()},
 saveS:()=>{const has=S.semesters.length;openModal(`<form id="sf"><h3>Pour quel semestre ?</h3>${has?`<label>Semestre<select name="sid" id="ssel">${[...S.semesters].sort(asc).map(x=>`<option value="${x.id}" ${x.id===S.target?'selected':''}>${esc(x.name)}</option>`).join('')}<option value="__new" ${S.target?'':'selected'}>+ Nouveau semestre</option></select></label>`:'<input type="hidden" name="sid" value="__new">'}<div id="snew" ${has&&S.target?'hidden':''}><label>Nom du semestre *<input name="n" maxlength="60" placeholder="Ex. : Semestre 5"></label><label>Description<textarea name="d" rows="3" maxlength="200" placeholder="Ex. : 3e année, 2025–2026"></textarea></label></div><div class="row"><button class="btn">Valider</button><button type="button" class="btn ghost" data-a="close">Annuler</button></div></form>`)},
 pickS:e=>{S.sid=e.id;go('home')},chSem:()=>{S.sid=null;go('home')},
 addS:()=>{S.imp=true;S.target=null;S.found=null;S.manual=false;S.slots={};render()},
 editS:async e=>{const x=semOf(e.id);if(!x)return;const v=await ask('Modifier le semestre',[{k:'name',l:'Nom *',v:x.name,req:1},{k:'desc',l:'Description',t:'area',v:x.desc,rows:3}]);if(v)await updateDoc(dref('semesters',x.id),{name:v.name.trim(),desc:(v.desc||'').trim()})},
 padd:e=>openModal(`<form id="pf"><h3>Ajouter un PDF</h3><label>Fichier PDF (8 Mo max) *<input type="file" name="file" accept="application/pdf,.pdf" required></label><label>Titre<input name="t" maxlength="120" placeholder="Par défaut : nom du fichier"></label><label>Rubrique<select name="c"><option value="">Aucune</option>${S.courses.map(c=>`<option value="${c.id}" ${c.id===(e.c||'')?'selected':''}>${esc(c.name)}${semOf(c.sid)?' ('+esc(semOf(c.sid).name)+')':''}</option>`).join('')}</select></label><div class="row"><button class="btn" id="pbtn">Enregistrer</button><button type="button" class="btn ghost" data-a="close">Annuler</button></div></form>`),
 pread:async e=>{const p=S.pdfs.find(x=>x.id===e.id);if(!p)return;toast('Ouverture…');try{const u=URL.createObjectURL(await pdfBlob(p));openModal(`<h3>${esc(p.title)}</h3><iframe src="${u}" title="${esc(p.title)}" style="width:100%;height:65vh;border:0;border-radius:14px;background:#F0F3FF"></iframe><div class="row"><a class="btn ghost" href="${u}" target="_blank" rel="noopener">Ouvrir dans un onglet</a><button class="btn ghost" data-a="close">Fermer</button></div>`);purl=u}catch{toast('Lecture impossible : document incomplet ou réseau indisponible')}},
 pdl:async e=>{const p=S.pdfs.find(x=>x.id===e.id);if(!p)return;try{const u=URL.createObjectURL(await pdfBlob(p)),a=document.createElement('a');a.href=u;a.download=slug(p.title)+'.pdf';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4e4)}catch{toast('Téléchargement impossible')}},
 pdelf:async e=>{const p=S.pdfs.find(x=>x.id===e.id);if(!p||!confirm('Supprimer ce document définitivement ?'))return;const b=writeBatch(db);b.delete(dref('pdfs',p.id));for(let i=0;i<p.n;i++)b.delete(dref('pdfchunks',p.id+'_'+i));await b.commit();toast('Document supprimé')},
cancelS:()=>{S.found=null;S.slots={};S.manual=false;render()},
 newSched:()=>{S.imp=true;S.target=S.sid;render()},
 skipS:()=>{S.imp=false;S.found=null;render()}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a]){if(t.type==='checkbox')e.stopPropagation();A[t.dataset.a](t.dataset)}else if(e.target.id==='modal'){back=null;closeModal()}});
document.addEventListener('submit',async e=>{e.preventDefault();
  if(e.target.id==='f'){const v=Object.fromEntries(new FormData(e.target));const p=pend;pend=null;$('#modal').hidden=true;p?.(v)}
  if(e.target.id==='fi'){const f=new FormData(e.target),ids=f.getAll('n'),mi=f.getAll('m'),c=course(S.cid),btn=$('#fibtn'),
    ns=S.notes.filter(n=>ids.includes(n.id)).sort(asc),ms=S.media.filter(m=>mi.includes(m.id)).sort(asc);
    if(!ns.length&&!ms.length){toast('Sélectionnez au moins une notion ou une capture');return}
    btn.disabled=true;btn.textContent='Création du PDF…';
    try{await fichePdf(String(f.get('t')).trim()||'Fiche de révision',c,ns,ms);closeModal();toast('Fiche téléchargée')}
    catch(x){console.error(x);btn.disabled=false;btn.textContent='Télécharger le PDF';toast('Création du PDF impossible : vérifiez votre connexion')}return}
  if(e.target.id==='rep'){const id=e.target.dataset.id,t=S.ptasks.find(x=>x.id===id),r=String(new FormData(e.target).get('report')||'').trim(),u={report:r};if(!r&&t.done)u.done=false;Object.assign(t,u);await updateDoc(dref('ptasks',id),u);toast('Compte rendu enregistré');A.pdetail({id});return}
  if(e.target.id==='sf'){const f=new FormData(e.target);let sid=f.get('sid');if(sid==='__new'){const n=String(f.get('n')||'').trim();if(!n){toast('Donnez un nom au semestre');return}sid=(await addDoc(col('semesters'),{name:n,desc:String(f.get('d')||'').trim(),ts:Date.now()})).id}$('#modal').hidden=true;await saveSchedule(sid);return}
  if(e.target.id==='pf'){const f=new FormData(e.target),file=f.get('file'),btn=$('#pbtn');
    if(!file||!(file.type==='application/pdf'||/\.pdf$/i.test(file.name))){toast('Choisissez un fichier PDF');return}
    if(file.size>8e6){toast('Fichier trop volumineux (8 Mo maximum)');return}
    btn.disabled=true;try{const b64=(await readFile(file)).split(',')[1],n=Math.ceil(b64.length/CH),id='p'+Date.now().toString(36);
      for(let i=0;i<n;i++){btn.textContent=`Enregistrement… ${i+1}/${n}`;await setDoc(dref('pdfchunks',id+'_'+i),{did:id,i,data:b64.slice(i*CH,(i+1)*CH)})}
      await setDoc(dref('pdfs',id),{title:String(f.get('t')||'').trim()||file.name.replace(/\.pdf$/i,''),cid:f.get('c')||'',size:file.size,n,ts:Date.now()});closeModal();toast('Document ajouté')}
    catch(x){console.error(x);btn.disabled=false;btn.textContent='Enregistrer';toast('Enregistrement impossible : vérifiez votre connexion')}return}
  if(e.target.id==='man'){addManual(Object.fromEntries(new FormData(e.target)));return}
  if(e.target.id==='login'){const f=new FormData(e.target),em=String(f.get('e')).trim(),pw=String(f.get('p')),er=$('#err');
    if(left()>0){tick();return}
    const bad=c=>{const o=fail();if(left()>0)tick();else er.textContent=c==='auth/too-many-requests'?'Trop de tentatives sur le serveur. Réessayez dans quelques minutes.':`Identifiants incorrects. Tentatives restantes : ${MAXTRY-o.n}.`};
    if(DEMO_ON&&em==='admin'&&pw==='admin'){setLk({n:0,until:0});S.demo=true;X=D;start({uid:'demo'});return}
    if(!F){if(DEMO_ON)bad();else er.textContent='Firebase non configuré.';return}
    if(!em.includes('@')){er.textContent='Saisissez l\'adresse e-mail de votre compte.';return}
    try{await F.signInWithEmailAndPassword(auth,em,pw);setLk({n:0,until:0})}
    catch(x){const c=x?.code||'';if(c==='auth/network-request-failed')er.textContent='Connexion au serveur impossible. Vérifiez votre réseau.';else bad(c)}}});
document.addEventListener('change',async e=>{
  if(e.target.id==='ssel')$('#snew').hidden=e.target.value!=='__new';
  if(e.target.classList.contains('gal')){const f=e.target.files[0];if(f)done(await shrink(await readFile(f)))}
  if(e.target.id==='sch'){const f=e.target.files[0];if(!f)return;S.scheduleName=f.name;S.busy='Analyse en cours… (une photo peut prendre 20 s)';render();
    try{S.found=extract(await readSchedule(f));if(!S.found.length)toast('Aucune matière détectée : ajoutez-les à la main')}catch(x){toast(x.message||'Lecture impossible');S.found=null}
    S.busy='';render()}});
/* ---------- Sécurité : fermeture de session après 5 minutes d'inactivité ---------- */
['pointerdown','keydown','mousemove','touchstart','scroll','wheel'].forEach(v=>addEventListener(v,()=>{last=Date.now()},{passive:true,capture:true}));
function expire(){if(!S.user)return;S.notice='Session fermée après 5 minutes d\'inactivité. Reconnectez-vous.';closeModal();back=null;A.out()}
const idle=()=>{if(S.user&&Date.now()-last>IDLE)expire()};
setInterval(idle,5000);document.addEventListener('visibilitychange',idle);
</script></body></html>
